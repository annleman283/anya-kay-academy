name: Apply Academy v2.8
on:
  push:
    paths:
      - '.github/workflows/apply-v28.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed v2.8 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          data='[... ELLIPSIZATION ...]'
          open('/tmp/v28.patch','wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/v28.patch
          git apply /tmp/v28.patch
          python -m py_compile academy_server.py
          node --check static/app.js
          git diff --check
      - name: Commit v2.8
        shell: bash
        run: |
          git config user.name 'ANYA KAY Academy updater'
          git config user.email 'actions@users.noreply.github.com'
          git add academy_server.py static/app.js static/app.css
          git commit -m 'feat: Academy v2.8 polish and download-only materials'
          git push
